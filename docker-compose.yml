services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freeworks-backend
    environment:
      DJANGO_SECRET_KEY: freeworks-docker-change-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - freeworks_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freeworks-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  freeworks_data: